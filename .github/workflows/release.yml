name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Require a changelog section for this tag
        run: node scripts/changelog-notes.mjs "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file cayfore.cdx.json --omit dev
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(node scripts/changelog-notes.mjs "$version")"
          gh release create "$GITHUB_REF_NAME" --title "Cayfore $version" --notes "$notes" cayfore.cdx.json
