name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Require a changelog section for this tag
        run: node scripts/changelog-notes.mjs "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(node scripts/changelog-notes.mjs "$version")"
          gh release create "$GITHUB_REF_NAME" --title "Cayfore $version" --notes "$notes"
