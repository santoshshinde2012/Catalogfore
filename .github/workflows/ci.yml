name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node scripts/lockfile-integrity.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:docs
      - run: npm run check:sources
      - run: npm run check:unit-costs
      - run: npm test
      - run: npm run build
      - run: npm run test:mcp
      - name: Install Chromium and system dependencies
        timeout-minutes: 15
        run: |
          # Keep the runner's official HTTPS fallbacks; the Azure mirror repeatedly stalled.
          if [ -f /etc/apt/apt-mirrors.txt ] && grep -q '^https://archive\.ubuntu\.com/ubuntu/' /etc/apt/apt-mirrors.txt; then
            sudo sed -i '/^http:\/\/azure\.archive\.ubuntu\.com\/ubuntu\//d' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - name: Browser checks on the built app
        run: |
          npm run preview -w @cayfore/web -- --host 127.0.0.1 --port 4175 --strictPort > /tmp/cayfore-preview.log 2>&1 &
          echo "$!" > /tmp/cayfore-preview.pid
          trap 'kill "$(cat /tmp/cayfore-preview.pid)" || true' EXIT
          ready=0
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4175/Catalogfore/; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/cayfore-preview.log
            exit 1
          fi
          node scripts/console-routes.mjs
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4175/Catalogfore/ npm run test:e2e
