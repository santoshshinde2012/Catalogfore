name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node scripts/lockfile-integrity.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:sources
      - run: npm run check:unit-costs
      - run: npm test
      - run: npm run build
      - run: npm run test:mcp
      - run: npx playwright install --with-deps chromium
      - name: Console on the built app
        run: |
          npm run preview -w @cayfore/web -- --host 127.0.0.1 --port 4175 --strictPort > /tmp/cayfore-preview.log 2>&1 &
          echo "$!" > /tmp/cayfore-preview.pid
          trap 'kill "$(cat /tmp/cayfore-preview.pid)" || true' EXIT
          ready=0
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4175/cayfore/; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/cayfore-preview.log
            exit 1
          fi
          node scripts/console-routes.mjs
      - run: npm run test:e2e
