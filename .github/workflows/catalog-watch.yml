name: Watch product catalog

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/catalog/src/catalog.test.ts packages/engine/src/products.test.ts
      - run: node scripts/catalog-watch.mjs
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "Update product catalog watch"
          title: "Product catalog watch"
          body: |
            Automated check of the Cayfore product catalog.

            The job validates the catalog, compares Azure Databricks consumption meters in every rate-card region with `knownAzureMeters`, refreshes the coverage report, and reads the public Databricks RSS feed for titles that may be new billable features. Manual citations older than 120 days are listed as stale. Databricks does not publish a price JSON, so AWS and GCP $/DBU are not rewritten.

            Review the report before merging. Figures are list signals for an estimate, not a quote.
          branch: catalog-watch
          add-paths: |
            data/catalog-watch-report.md
            data/catalog-watch-state.json
            data/coverage-summary.json
            docs/COVERAGE.md
