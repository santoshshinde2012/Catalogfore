name: Refresh list prices

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 90
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/refresh-prices.mjs
        env:
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
      - run: node --test scripts/validate-catalog.test.mjs
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "Refresh list prices"
          title: "Refresh list prices"
          body: |
            Automated refresh of on-demand VM rates and Azure Databricks DBU meters.

            AWS rows come from the public EC2 offer files, for every AWS region in the catalog. Spot rates, when present, come from the Spot Instance advisor or the Azure Spot meter. Azure DBU meters come from the Retail Prices API. GCP runs only when the `GCP_BILLING_API_KEY` repository secret is set, and is skipped otherwise. Instance DBU counts stay in the cited `data/instances.json` table and are not rewritten. Databricks does not publish a price JSON, so the curated $/DBU table is not rewritten either.

            Review the diff before merging. Figures are list prices for estimation, not a quote.
          branch: price-refresh
          add-paths: |
            data/cloud-vm-prices.json
            data/azure-dbu-meters.json
            data/instances.json
            data/pricing-probe.json
