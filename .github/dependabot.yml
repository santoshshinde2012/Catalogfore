version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
