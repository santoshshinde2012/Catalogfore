<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F6F7" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Page not found — Cayfore</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f6f7;
        color: #0b2026;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 4rem 1.5rem 3rem;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        color: inherit;
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: #ff3621;
      }
      h1 {
        margin: 2.5rem 0 0.75rem;
        font-size: 2.25rem;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #3e4c53;
      }
      a.home {
        display: inline-flex;
        margin-top: 1.5rem;
        padding: 0.5rem 0.875rem;
        border-radius: 0.75rem;
        background: #c42812;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a.home:focus-visible {
        outline: 2px solid #c42812;
        outline-offset: 2px;
      }
      footer {
        margin-top: 3rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="mark" href="/cayfore/">
        <span class="dot" aria-hidden="true"></span>
        Cayfore
      </a>
      <h1>Page not found</h1>
      <p>That address is not part of this forecast.</p>
      <a class="home" href="/cayfore/">Back to the forecast</a>
      <footer>
        <p>An independent estimate of Databricks spend. Not a quote, and not affiliated with Databricks.</p>
      </footer>
    </main>
  </body>
</html>
